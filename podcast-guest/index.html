<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio Board · VA Cannabis Lawyers Podcast</title>
<style>
  @font-face { font-family: Newsreader; font-weight: 500; src: url(fonts/newsreader-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: "Instrument Sans"; font-weight: 400; src: url(fonts/instrument-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url(fonts/instrument-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: "Instrument Sans"; font-weight: 700; src: url(fonts/instrument-sans-latin-700-normal.woff2) format('woff2'); }
  :root {
    --evergreen:#173B2F; --ink:#16201B; --brass:#C8963E; --limestone:#F2EFE6; --gold-light:#DDBF86; --gold-dark:#8A6424;
    --footer:#0F2A21; --muted:#55605A; --hair:#DDD8CA; --card:#FBFAF6; --live:#B4432C; --ok:#3E7D4F;
    --serif: Newsreader, Georgia, serif; --sans: "Instrument Sans", Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--limestone); color:var(--ink); font:15px/1.4 var(--sans); display:flex; flex-direction:column; overflow:hidden;
         -webkit-font-smoothing:antialiased; }
  body.dragging, body.dragging * { user-select:none; }
  body.dragging iframe { pointer-events:none; }
  button { font-family:inherit; }

  /* top bar */
  .top { flex:none; display:flex; align-items:center; gap:16px; padding:10px 20px; background:var(--evergreen); color:var(--limestone); }
  .top .eyebrow { font:600 11px/1 var(--sans); letter-spacing:.3em; text-transform:uppercase; color:var(--gold-light); margin-bottom:5px; }
  .top .name { font:500 22px/1 var(--serif); }
  .top .what { margin-left:6px; padding-left:16px; border-left:1px solid rgba(242,239,230,.25); font:600 12px/1 var(--sans);
               letter-spacing:.18em; text-transform:uppercase; color:#D5DDD7; }
  .status { margin-left:auto; display:flex; align-items:center; gap:8px; font:600 12.5px/1 var(--sans); padding:7px 12px;
            border-radius:999px; background:rgba(242,239,230,.1); color:#D5DDD7; white-space:nowrap; }
  .status i { width:9px; height:9px; border-radius:50%; background:var(--gold-light); animation:blink 1.4s infinite; }
  .status.ok i { background:#7BC48D; animation:none; }
  .status.bad i { background:#E58A73; animation:none; }
  @keyframes blink { 50% { opacity:.3; } }

  /* main split: camera (optional) | board */
  .wrap { flex:1; min-height:0; display:grid; grid-template-columns:1fr; }
  .wrap.has-cam { grid-template-columns: var(--camW, 36%) 10px 1fr; }
  #cam { display:none; min-height:0; background:#111; }
  .wrap.has-cam #cam { display:block; }
  #cam iframe { width:100%; height:100%; border:0; display:block; }
  #split { display:none; cursor:col-resize; position:relative; background:var(--limestone); }
  .wrap.has-cam #split { display:block; }
  #split::after { content:""; position:absolute; left:4px; top:50%; width:2px; height:48px; margin-top:-24px; background:var(--hair); border-radius:2px; }
  #split:hover::after { background:var(--brass); }

  /* board pane */
  #pane { min-height:0; min-width:0; container-type:inline-size; overflow:hidden; }
  .board { height:100%; display:grid; grid-template-columns:1fr; grid-template-rows:auto auto 1fr; gap:12px; padding:16px 18px 16px; }
  @container (min-width: 640px) {
    .board { grid-template-columns:minmax(0, 1fr) 240px; grid-template-rows:auto 1fr; column-gap:14px; }
    .stagewrap { grid-column:1; grid-row:1; }
    .nav { grid-column:1; grid-row:2; align-self:start; }
    .list { grid-column:2; grid-row:1 / span 2; }
    .row { padding:7px 12px; font-size:13px; } .seg, .list h3 { padding-left:12px; padding-right:12px; }
  }
  @container (min-width: 980px) {
    .board { grid-template-columns:minmax(0, 1fr) 340px; grid-template-rows:auto 1fr; column-gap:18px; }
    .row { padding:8px 16px; font-size:14px; } .seg, .list h3 { padding-left:16px; padding-right:16px; }
    .stagewrap { grid-column:1; grid-row:1; }
    .nav { grid-column:1; grid-row:2; align-self:start; }
    .list { grid-column:2; grid-row:1 / span 2; }
  }

  .stagewrap { position:relative; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; background:var(--card); border:1px solid var(--hair); border-radius:10px;
           overflow:hidden; box-shadow:0 1px 2px rgba(22,32,27,.06), 0 8px 24px rgba(22,32,27,.07); }
  .stage iframe { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; transform-origin:0 0; pointer-events:none; }
  .stage.live { border-color:var(--live); box-shadow:0 0 0 2px var(--live), 0 8px 24px rgba(22,32,27,.08); }
  .badge { display:flex; align-items:center; gap:8px; min-height:26px; margin-bottom:8px; font:600 13px/1.2 var(--sans); color:var(--muted); }
  .badge .what { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font:700 11px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; padding:6px 9px; border-radius:4px;
         background:var(--evergreen); color:var(--limestone); }
  .tag.live { background:var(--live); color:#fff; }
  .tag.live::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#fff; margin-right:6px;
                      vertical-align:1px; animation:blink 1.2s infinite; }
  .tag.next { background:var(--brass); color:var(--ink); }
  .tag.dim { background:#8C928E; }
  .empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
           text-align:center; padding:24px; color:var(--muted); background:var(--card); z-index:3; }
  .empty b { font:500 26px/1.2 var(--serif); color:var(--evergreen); }
  .empty[hidden] { display:none; }

  .nav { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--hair); background:#fff; color:var(--ink); border-radius:6px; padding:8px 12px; font:600 13px/1 var(--sans);
         cursor:pointer; }
  .btn:hover:not(:disabled) { border-color:var(--evergreen); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.primary { background:var(--evergreen); border-color:var(--evergreen); color:var(--limestone); }
  .pos { font:600 13px/1 var(--sans); color:var(--muted); min-width:90px; text-align:center; }
  .follow { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; }
  .follow input { accent-color:var(--evergreen); width:16px; height:16px; }
  .hint { font-size:12.5px; color:var(--muted); width:100%; }

  /* rundown list */
  .list { min-height:0; overflow-y:auto; background:#fff; border:1px solid var(--hair); border-radius:10px; padding:6px 0 10px; }
  .list h3 { margin:0; padding:12px 16px 8px; font:700 11px/1 var(--sans); letter-spacing:.2em; text-transform:uppercase; color:var(--evergreen);
             position:sticky; top:-6px; background:#fff; z-index:1; }
  .seg { padding:12px 16px 4px; font:600 11px/1.3 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--gold-dark); }
  .row { display:grid; grid-template-columns:30px 1fr auto; gap:8px; align-items:center; width:100%; text-align:left; border:0; background:none;
         padding:8px 16px; cursor:pointer; color:var(--ink); font:400 14px/1.3 var(--sans); border-left:3px solid transparent; }
  .row:hover { background:#F6F4EE; }
  .row .n { font:500 14px/1 var(--serif); color:var(--muted); }
  .row .t { min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .row.sel { background:#EEF2EC; border-left-color:var(--evergreen); font-weight:600; }
  .row.onair { border-left-color:var(--live); }
  .row.onair .n { color:var(--live); }
  .row .tag { font-size:9.5px; padding:4px 6px; }
  .list .none { padding:10px 16px; color:var(--muted); font-size:13px; }

  .foot { flex:none; display:flex; justify-content:space-between; gap:12px; padding:7px 20px; background:var(--footer); color:#C9D3CC;
          font:400 12px/1.2 var(--sans); }
  .foot b { color:var(--gold-light); font-weight:600; }

  @media (max-width: 820px) {
    .wrap.has-cam { grid-template-columns:1fr; grid-template-rows:45vh 1fr; }
    .wrap.has-cam #split { display:none; }
    .top .what { display:none; }
  }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="eyebrow">Virginia</div>
      <div class="name">Cannabis Lawyers Podcast</div>
    </div>
    <div class="what">Studio board</div>
    <div class="status" id="status"><i></i><span id="statusText">Connecting…</span></div>
  </div>

  <div class="wrap" id="wrap">
    <section id="cam"></section>
    <div id="split" title="Drag to resize"></div>
    <section id="pane">
      <div class="board">
        <div class="stagewrap">
          <div class="badge" id="badge"></div>
          <div class="stage" id="stage">
            <iframe id="screen" src="display.html?preview=1" title="Board preview" tabindex="-1"></iframe>
            <div class="empty" id="empty"><b>Waiting for the studio</b><span id="emptyText">The board shows up here as soon as the studio console is open.</span></div>
          </div>
        </div>
        <div class="nav">
          <button class="btn" id="prev" title="Previous slide (↑ or ←)">◀ Previous</button>
          <span class="pos" id="pos">–</span>
          <button class="btn" id="next" title="Next slide (↓ or →)">Next ▶</button>
          <button class="btn primary" id="toLive" hidden>Back to what's on air</button>
          <label class="follow"><input type="checkbox" id="follow" checked> Follow what's on air</label>
        </div>
        <div class="list" id="list"><h3>Rundown</h3><div class="none">No slides yet.</div></div>
      </div>
    </section>
  </div>

  <div class="foot"><span><b>Look only.</b> Nothing you click here changes the show.</span><span>Studio by WalkerOps</span></div>

<script src="vdoninja-sdk.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const KEY = (params.get('k') || '').replace(/[^A-Za-z0-9]/g, '');

  // ---------- camera: the guest's own VDO Ninja link, embedded on the left ----------
  (function camera() {
    const join = params.get('join');
    if (!join) return;
    let u; try { u = new URL(join); } catch { return; }
    if (u.protocol !== 'https:' || !/(^|\.)vdo\.ninja$/i.test(u.hostname)) return;   // only ever embed VDO Ninja
    const f = document.createElement('iframe');
    f.src = u.toString(); f.title = 'Your camera';
    f.allow = 'camera; microphone; autoplay; fullscreen; display-capture; speaker-selection; clipboard-write; picture-in-picture';
    $('cam').appendChild(f); $('wrap').classList.add('has-cam');
    let camW = 36; try { camW = +localStorage.getItem('vclGuest.camW') || 36; } catch {}
    const setW = w => { camW = Math.max(25, Math.min(70, w)); $('wrap').style.setProperty('--camW', camW + '%'); fitScreen(); };
    setW(camW);
    $('split').addEventListener('pointerdown', e => {
      e.preventDefault(); $('split').setPointerCapture(e.pointerId); document.body.classList.add('dragging');
      const r = $('wrap').getBoundingClientRect();
      const move = ev => setW((ev.clientX - r.left) / r.width * 100);
      const up = () => { $('split').removeEventListener('pointermove', move); $('split').removeEventListener('pointerup', up);
                         document.body.classList.remove('dragging'); try { localStorage.setItem('vclGuest.camW', camW); } catch {} };
      $('split').addEventListener('pointermove', move); $('split').addEventListener('pointerup', up);
    });
  })();

  // ---------- scale the 1920 × 1080 board into its box ----------
  function fitScreen() {
    const st = $('stage'), w = st.clientWidth;
    if (w) $('screen').style.transform = `scale(${w / 1920})`;
  }
  new ResizeObserver(fitScreen).observe($('stage'));
  addEventListener('resize', fitScreen);

  // ---------- what the studio has told us ----------
  let show = null;               // { slides, live, liveIdx, visible, logo }
  const images = {};             // hash -> data URL
  const parts = {};              // hash -> [chunks]
  let sel = -1;                  // selected row: slide index, or -1 for "the live board" when it isn't in the rundown
  let follow = true;
  let screenReady = false, pendingScreen = null;

  function status(kind, text) { $('status').className = 'status ' + (kind || ''); $('statusText').textContent = text; }

  function slideState(s) {
    if (!s) return null;
    return Object.assign({}, s, { image: s.img ? (images[s.img] || null) : null, logo: show && show.logo ? (images[show.logo] || null) : null,
                                  visible: true, sharedBg: false });
  }
  function paintScreen(state) {
    if (!screenReady) { pendingScreen = state; return; }
    try { $('screen').contentWindow.postMessage({ vclPreview: true, state }, '*'); } catch {}
  }
  addEventListener('message', e => {
    if (e.data && e.data.vclPreviewReady === 'board') { screenReady = true; if (pendingScreen) { paintScreen(pendingScreen); pendingScreen = null; } }
  });

  const titleOf = s => (s.title || s.caption || (s.body || '').split('\n').find(l => l.trim()) || 'Photo').replace(/\*\*/g, '').replace(/^\s*[-*•]\s+/, '');
  const segOf = s => (s.segment || '').trim();

  function render() {
    const slides = show ? show.slides : [];
    const liveIdx = show ? show.liveIdx : -1;
    const liveOff = show && show.live && liveIdx < 0;              // something on air that isn't one of the slides
    const hidden = show && show.visible === false;

    // list
    const list = $('list'); list.innerHTML = '<h3>Rundown</h3>';
    if (liveOff) {
      const r = row('★', titleOf(show.live), -1);
      list.appendChild(r);
    }
    if (!slides.length) { const d = document.createElement('div'); d.className = 'none'; d.textContent = show ? 'No slides in the rundown yet.' : 'No slides yet.'; list.appendChild(d); }
    let lastSeg = null;
    slides.forEach((s, i) => {
      const seg = segOf(s);
      if (seg !== lastSeg) {
        lastSeg = seg;
        if (seg) { const h = document.createElement('div'); h.className = 'seg'; h.textContent = seg.replace(/^segment\s+/i, 'Segment '); list.appendChild(h); }
      }
      list.appendChild(row(String(i + 1).padStart(2, '0'), titleOf(s), i));
    });
    function row(num, text, i) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'row'; b.dataset.i = i;
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="x"></span>';
      b.children[0].textContent = num; b.children[1].textContent = text; b.title = text;
      const isLive = show && show.live && (i === liveIdx || (i === -1 && liveOff));
      if (isLive) { b.classList.add('onair'); b.children[2].innerHTML = hidden ? '<span class="tag dim">Hidden</span>' : '<span class="tag live">On air</span>'; }
      else if (i >= 0 && liveIdx >= 0 && i === liveIdx + 1) b.children[2].innerHTML = '<span class="tag next">Next</span>';
      if (i === sel) b.classList.add('sel');
      b.onclick = () => choose(i, true);
      return b;
    }

    // stage
    const count = slides.length;
    const haveSel = sel === -1 ? liveOff : (sel >= 0 && sel < count);
    $('empty').hidden = !!(show && haveSel);
    if (show && !haveSel) {
      $('empty').querySelector('b').textContent = 'Nothing on the board yet';
      $('emptyText').textContent = 'The rundown and the board will show up here as the studio adds them.';
    }
    const s = sel === -1 ? (liveOff ? show.live : null) : slides[sel];
    if (s) paintScreen(slideState(s));
    const isLive = !!(s && show.live && (sel === liveIdx || (sel === -1 && liveOff)));
    $('stage').classList.toggle('live', isLive && !hidden);
    const badge = $('badge'); badge.innerHTML = '';
    const tag = (cls, txt) => { const t = document.createElement('span'); t.className = 'tag ' + cls; t.textContent = txt; badge.appendChild(t); };
    if (s) {
      if (isLive) tag(hidden ? 'dim' : 'live', hidden ? 'On air, but hidden' : 'On air');
      else if (sel >= 0 && liveIdx >= 0 && sel === liveIdx + 1) tag('next', 'Up next');
      else tag('', 'Preview');
      const w = document.createElement('span'); w.className = 'what';
      w.textContent = isLive ? (hidden ? 'The board is hidden, so viewers don’t see it right now' : 'This is what viewers see right now') : (sel >= 0 && liveIdx >= 0 && sel === liveIdx + 1 ? 'Coming up after the slide on air' : 'Only you see this. It isn’t on air');
      badge.appendChild(w);
    }
    $('pos').textContent = sel >= 0 && count ? `Slide ${sel + 1} of ${count}` : (sel === -1 && liveOff ? 'Live board' : '–');
    $('prev').disabled = !(sel > 0);
    $('next').disabled = !(count && sel < count - 1);
    const liveTarget = liveIdx >= 0 ? liveIdx : (liveOff ? -1 : null);
    $('toLive').hidden = follow || liveTarget === null || liveTarget === sel;
    $('follow').checked = follow;
    const selEl = list.querySelector('.row.sel'); if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  function choose(i, byHand) {
    if (byHand) {
      const liveTarget = show ? (show.liveIdx >= 0 ? show.liveIdx : (show.live ? -1 : null)) : null;
      follow = (i === liveTarget);                                  // picking the live slide puts you back on follow
    }
    sel = i; render();
  }
  function snapToLive() {
    if (!show) return;
    if (show.liveIdx >= 0) sel = show.liveIdx;
    else if (show.live) sel = -1;
    else if (sel < 0 || sel >= show.slides.length) sel = show.slides.length ? 0 : -1;
  }
  $('prev').onclick = () => { if (sel > 0) choose(sel - 1, true); };
  $('next').onclick = () => { if (show && sel < show.slides.length - 1) choose(sel + 1, true); };
  $('toLive').onclick = () => { follow = true; snapToLive(); render(); };
  $('follow').onchange = () => { follow = $('follow').checked; if (follow) snapToLive(); render(); };
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
  });

  // ---------- the connection to the studio (peer to peer, through VDO Ninja) ----------
  if (!KEY) {
    status('bad', 'This link is missing its board key');
    $('empty').querySelector('b').textContent = 'This link isn’t complete';
    $('emptyText').textContent = 'Ask the studio for a fresh board link.';
    return;
  }
  const ROOM = 'vclboard' + KEY, STUDIO = 'studio' + KEY.slice(0, 10);
  let studioUuid = null;
  const sdk = new VDONinjaSDK({ salt: 'vdo.ninja', password: KEY, debug: false });

  let lastHeard = 0;
  function onData(d, uuid) {
    if (!d || d.vclb !== 1) return;
    studioUuid = uuid; lastHeard = Date.now();
    if (d.t === 'beat') { if (!show) sdk.sendData({ vclb: 1, t: 'hello' }, uuid); else status('ok', 'Connected to the studio'); return; }
    if (d.t === 'state') {
      const prevLive = show ? show.liveIdx : null, prevLiveObj = show ? JSON.stringify(show.live) : null;
      show = { slides: d.slides || [], live: d.live || null, liveIdx: typeof d.liveIdx === 'number' ? d.liveIdx : -1,
               visible: d.visible !== false, logo: d.logo || null };
      // fetch any pictures we don't have yet
      const want = new Set();
      show.slides.forEach(s => { if (s.img && !images[s.img]) want.add(s.img); });
      if (show.live && show.live.img && !images[show.live.img]) want.add(show.live.img);
      if (show.logo && !images[show.logo]) want.add(show.logo);
      if (want.size) sdk.sendData({ vclb: 1, t: 'need', h: [...want] }, uuid);
      if (follow && (show.liveIdx !== prevLive || JSON.stringify(show.live) !== prevLiveObj || sel === null)) snapToLive();
      if (sel >= show.slides.length) sel = show.slides.length - 1;
      if (sel === -1 && !(show.live && show.liveIdx < 0)) snapToLive();
      status('ok', 'Connected to the studio');
      render();
    } else if (d.t === 'img') {
      (parts[d.h] = parts[d.h] || [])[d.i] = d.d;
      const p = parts[d.h];
      if (p.filter(x => x != null).length === d.n) { images[d.h] = p.join(''); delete parts[d.h]; render(); }
    }
  }
  sdk.addEventListener('dataReceived', e => onData(e.detail.data, e.detail.uuid));
  sdk.addEventListener('dataChannelOpen', e => { sdk.sendData({ vclb: 1, t: 'hello' }, e.detail.uuid); });
  const lost = e => { if (e.detail && e.detail.uuid === studioUuid) { studioUuid = null; status('', 'The studio console is offline. Waiting for it…'); } };
  sdk.addEventListener('dataChannelClose', lost);
  sdk.addEventListener('peerDisconnected', lost);
  let lastTry = 0;
  const tryView = () => {
    if (studioUuid || Date.now() - lastTry < 6000) return;      // one attempt at a time
    lastTry = Date.now();
    sdk.view(STUDIO, { audio: false, video: false }).catch(() => {});
  };
  sdk.addEventListener('videoaddedtoroom', e => { if ((e.detail || {}).streamID === STUDIO) tryView(); });
  sdk.addEventListener('listing', e => {
    const l = (e.detail || {}).list || [];
    if (l.some(x => (x.streamID || x) === STUDIO)) tryView();
  });
  sdk.addEventListener('reconnectFailed', () => status('bad', 'Can’t reach the studio. Reload this page.'));

  (async () => {
    try {
      status('', 'Waiting for the studio…');
      await sdk.connect();
      await sdk.joinRoom({ room: ROOM });
      tryView();
    } catch (err) {
      status('bad', 'Can’t connect. Check your internet, then reload.');
    }
  })();
  // If the studio isn't open yet, keep looking quietly until it is.
  setInterval(() => {
    // The studio sends a heartbeat every few seconds. If it stops, the console was closed or lost its connection.
    if (studioUuid && Date.now() - lastHeard > 15000) { studioUuid = null; status('', 'The studio console is offline. Waiting for it…'); }
    if (!studioUuid && sdk.state && sdk.state.connected) tryView();
  }, 4000);

  render();
})();
</script>
</body>
</html>
