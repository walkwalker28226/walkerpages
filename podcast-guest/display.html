<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canna-Chats – On-Air Board</title>
<style>
  @font-face { font-family: Archivo; src: url(fonts/archivo-variable.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2'); }

  /* Canna-Chats "Signal" palette */
  :root {
    --night:#0E0F0C; --graphite:#2A2C27; --smoke:#E9E9E4; --volt:#C6F432; --uv:#7B5CFF; --uv-deep:#5A3FE0; --ash:#A3A39C;
    --display: Archivo, "Arial Black", Helvetica, sans-serif;
    --sans: Archivo, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  /* Light theme: Smoke page, Night type, Volt only as a fill */
  body { --bg:var(--smoke); --dots:transparent; --head-name:var(--night); --slash:var(--uv-deep); --chip:var(--night);
         --seg:var(--graphite); --rule:var(--night); --rule-h:2px; --card-bg:#FFFFFF; --card-line:rgba(14,15,12,.12);
         --title:var(--night); --text:var(--night); --marker:var(--night); --num:var(--uv-deep); --strong:var(--night);
         --foot-bg:var(--night); --frame:var(--night); --caption:var(--graphite); --burst-bars:var(--night); --burst-dot:var(--night); }
  /* Dark theme (default look on stream): Night ground, Graphite cards, Volt accents */
  body.dark { --bg:var(--night); --dots:#3A3C36; --head-name:var(--smoke); --slash:var(--volt); --chip:var(--smoke);
         --seg:var(--ash); --rule:var(--volt); --rule-h:4px; --card-bg:var(--graphite); --card-line:var(--graphite);
         --title:var(--smoke); --text:var(--smoke); --marker:var(--volt); --num:var(--volt); --strong:#FFFFFF;
         --foot-bg:#000000; --frame:var(--volt); --caption:var(--ash); --burst-bars:var(--volt); --burst-dot:var(--uv); }

  html, body { margin:0; padding:0; }
  body { width:1920px; height:1080px; overflow:hidden; background:transparent; color:var(--text);
         font-family:var(--sans); position:relative; -webkit-font-smoothing:antialiased; }
  /* Background lives on its own layer: OBS's default browser-source CSS forces <body> transparent. */
  #canvas { position:absolute; inset:0; background-color:var(--bg);
            background-image:radial-gradient(var(--dots) 1.5px, transparent 1.5px); background-size:18px 18px; background-position:9px 9px; }
  body.transparent-bg #canvas { display:none; }

  header { position:absolute; left:80px; right:80px; top:40px; height:100px;
           display:flex; align-items:center; justify-content:space-between; }
  header::after { content:""; position:absolute; left:0; right:0; bottom:-4px; height:var(--rule-h); background:var(--rule); }
  .brand { display:flex; align-items:center; gap:20px; }
  .brand img { height:76px; width:auto; display:none; }
  .brand img.on { display:block; }
  .brand svg { flex:none; }
  .brand svg path { stroke:var(--burst-bars); }
  .brand svg circle { fill:var(--burst-dot); }
  .name { font:900 54px/.9 var(--display); font-stretch:125%; letter-spacing:-1.5px; text-transform:uppercase; color:var(--head-name); white-space:nowrap; padding-top:4px; }
  .name i { font-style:normal; color:var(--slash); }
  .chip { font:700 16px/1 var(--mono); letter-spacing:2px; color:var(--chip); border:2px solid var(--chip); padding:7px 12px; margin-left:4px; }
  .segment { font:700 20px/1.2 var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--seg);
             text-align:right; max-width:760px; }
  .segment:not(:empty)::before { content:"// "; }

  main { position:absolute; left:80px; right:80px; top:184px; bottom:104px; }
  body.layout-left main { right:calc(1920px * .42); }

  .board { position:absolute; inset:0; display:flex; gap:56px; align-items:stretch;
           opacity:0; transform:translateY(14px); transition:opacity .45s ease, transform .45s ease; }
  .board.show { opacity:1; transform:none; }

  .card { flex:1 1 0; min-width:0; background:var(--card-bg); border:2px solid var(--card-line); border-radius:0;
          padding:56px 64px; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden; }
  .card.empty { display:none; }
  .title { font:900 64px/.95 var(--display); font-stretch:125%; letter-spacing:-1.5px; text-transform:uppercase; color:var(--title); margin:0 0 30px; }
  .title:empty { display:none; }
  .title::after { content:""; display:block; width:96px; height:6px; background:var(--volt); margin-top:26px; }
  .body { flex:1; min-height:0; overflow:hidden; font-size:44px; line-height:1.3; font-weight:400; }
  .body p { margin:0 0 .55em; }
  .body ul, .body ol { margin:0 0 .55em; padding:0; list-style:none; }
  .body li { position:relative; padding-left:1.15em; margin:0 0 .5em; }
  .body ul > li::before { content:""; position:absolute; left:.1em; top:.5em; width:.3em; height:.3em; background:var(--marker); }
  .body ol { counter-reset:n; }
  .body ol > li { counter-increment:n; padding-left:1.7em; }
  .body ol > li::before { content:counter(n, decimal-leading-zero); position:absolute; left:0; top:.12em;
                          font:700 .78em/1.3 var(--mono); color:var(--num); }
  .body li.sub { margin-left:1.2em; font-size:.84em; }
  .body li.sub::before { background:transparent; box-shadow:inset 0 0 0 .07em var(--marker); }
  .body strong { color:var(--strong); font-weight:800; }
  .body em { font-style:italic; }

  .media { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .media.empty { display:none; }
  .frame { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .frame img { max-width:100%; max-height:100%; display:block; box-sizing:border-box;
               border:3px solid var(--frame); border-radius:0; background:var(--card-bg); }
  /* Portrait frame: crops to 4:5, best for headshots. (Value "arch" kept so saved slides still work.) */
  .frame.arch img { height:100%; width:auto; aspect-ratio:4/5; object-fit:cover; }
  .caption { font:500 24px/1.3 var(--mono); color:var(--caption); margin-top:18px; text-align:center; max-width:90%; }
  .caption:empty { display:none; }
  .board.image-only .media { flex:1 1 auto; }

  footer { position:absolute; left:0; right:0; bottom:0; height:64px; background:var(--foot-bg);
           display:flex; align-items:center; justify-content:space-between; padding:0 80px; box-sizing:border-box;
           font:500 17px/1 var(--mono); color:var(--ash); }
  footer .firm { display:flex; align-items:center; gap:18px; }
  footer .firm b { font:900 22px/1 var(--display); font-stretch:125%; color:var(--smoke); letter-spacing:-.3px; text-transform:uppercase; }
  footer .firm b i { font-style:normal; color:var(--volt); }
  footer .disc { opacity:.9; font-size:15px; }
  footer .disc.off { display:none; }

</style>
</head>
<body>
  <div id="canvas"></div>
  <header>
    <div class="brand">
      <img id="logo" alt="">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="10 2 180 180" width="76" height="76" aria-hidden="true"><path d="M100 142V20 M108.4 144.1L155.4 55.8 M91.6 144.1L44.6 55.8 M114.9 149.9L173 110.8 M85.1 149.9L27 110.8 M117.9 158.1L151.7 154.5 M82.1 158.1L48.3 154.5" stroke-width="14" stroke-linecap="round" fill="none"/><circle cx="100" cy="160" r="9"/></svg>
      <div class="name">Canna<i>/</i>Chats</div>
      <div class="chip">PODCAST</div>
    </div>
    <div class="segment" id="segment"></div>
  </header>

  <main>
    <div class="board" id="board">
      <section class="card" id="card">
        <h1 class="title" id="title"></h1>
        <div class="body" id="body"></div>
      </section>
      <section class="media empty" id="media">
        <div class="frame" id="frame"><img id="photo" alt=""></div>
        <div class="caption" id="caption"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="firm"><b>Canna<i>/</i>Chats</b><span>The cannabis economy, unfiltered.</span></div>
    <div class="disc" id="disc">General information only, not legal advice. Watching does not create an attorney-client relationship.</div>
  </footer>

<script src="config.js" onerror="window.VCL_CONFIG={}"></script>
<script src="obsws.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const isPreview = params.has('preview');
  if (isPreview) document.body.classList.add('preview');

  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>');

  // Turn pasted text into bullets/paragraphs.
  //  "- ", "* ", "• ", "– " => bullet     "1. " or "1) " => numbered     indented bullet => sub-bullet
  function render(text) {
    const out = []; let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    (text || '').replace(/\r/g,'').split('\n').forEach(raw => {
      const line = raw.replace(/\s+$/,'');
      if (!line.trim()) { close(); return; }
      let m;
      if ((m = line.match(/^(\s*)[-*•–·▪◦]\s+(.*)$/))) {
        if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; }
        out.push(`<li${m[1].length >= 2 ? ' class="sub"' : ''}>${inline(m[2])}</li>`);
      } else if ((m = line.match(/^(\s*)\d+[.)]\s+(.*)$/))) {
        if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; }
        out.push(`<li${m[1].length >= 2 ? ' class="sub"' : ''}>${inline(m[2])}</li>`);
      } else {
        close(); out.push(`<p>${inline(line.trim())}</p>`);
      }
    });
    close();
    return out.join('');
  }

  // Shrink text until it fits the card.
  function fit() {
    const b = $('body');
    let size = 46;
    b.style.fontSize = size + 'px';
    while (size > 18 && b.scrollHeight > b.clientHeight + 1) { size -= 2; b.style.fontSize = size + 'px'; }
    const t = $('title');
    let ts = 64; t.style.fontSize = ts + 'px';
    while (ts > 40 && t.scrollHeight > 230) { ts -= 4; t.style.fontSize = ts + 'px'; }
  }

  let current = {};
  let swapTimer = null;
  function apply(s, instant) {
    current = s;
    const cls = document.body.classList;
    cls.toggle('dark', s.theme !== 'light');
    cls.toggle('layout-left', s.layout === 'left');
    // The shared background (Backgrounds blade) shows through when it's switched on for the Board scene.
    cls.toggle('transparent-bg', !!s.sharedBg || params.has('transparent'));
    $('segment').textContent = s.segment || '';
    $('disc').classList.toggle('off', s.disclaimer === false);
    const logo = $('logo');
    if (s.logo) { logo.src = s.logo; logo.classList.add('on'); } else { logo.removeAttribute('src'); logo.classList.remove('on'); }

    const board = $('board');
    const fill = () => {
      const hasText = !!((s.title || '').trim() || (s.body || '').trim());
      const hasImg = !!s.image;
      $('title').textContent = s.title || '';
      $('body').innerHTML = render(s.body);
      $('card').classList.toggle('empty', !hasText);
      $('media').classList.toggle('empty', !hasImg);
      board.classList.toggle('image-only', hasImg && !hasText);
      $('frame').classList.toggle('arch', s.frame === 'arch');
      if (hasImg) $('photo').src = s.image; else $('photo').removeAttribute('src');
      $('caption').textContent = s.caption || '';
      fit();
      board.classList.toggle('show', s.visible !== false && (hasText || hasImg));
    };
    clearTimeout(swapTimer);
    if (instant || !board.classList.contains('show')) fill();
    else { board.classList.remove('show'); swapTimer = setTimeout(fill, 380); }
  }
  window.vclApply = apply;

  // Preview mode: the control panel drives this page directly.
  if (isPreview) {
    window.addEventListener('message', e => { if (e.data && e.data.vclPreview) apply(e.data.state, true); });
    window.parent && window.parent.postMessage({ vclPreviewReady: 'board' }, '*');
    return;
  }

  if (params.has('demo')) {
    apply({ segment: 'Episode 12 · Licensing', title: 'Before you sign a lease',
      body: '- Confirm local **zoning** allows your use\n- Check setback distances from schools\n  - Measure property line to property line\n- Ask about the permitting timeline\n\nPlan for review time before opening day.',
      theme: params.get('demo') === 'dark' ? 'dark' : 'light', layout: params.get('layout') || 'full', visible: true }, true);
    return;
  }


  const remembered = vclMemory.get('board');
  if (remembered) apply(remembered, true);

  const cfg = window.VCL_CONFIG || {};
  const link = new ObsLink({
    port: +(params.get('port') || cfg.port || 4455),
    password: params.get('password') ?? cfg.password ?? '',
    onMessage: msg => {
      if (msg.type === 'state' && msg.target === 'board') { apply(msg.state); vclMemory.set('board', msg.state); }
    },
    // Connection problems are shown in the console, never on air.
    onStatus: s => { if (s === 'connected') link.send({ type: 'hello', target: 'board' }); }
  });
  link.connect();
})();
</script>
</body>
</html>
